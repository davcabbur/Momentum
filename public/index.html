<!DOCTYPE html>
<!--
  Cáscara HTML de la versión web (PWA).

  Expo usa este archivo como plantilla cuando `web.output` es "single" (ver
  @expo/cli → webTemplate.ts): rellena los marcadores del idioma y del título con lo
  que hay en app.json, y engancha el <script> del bundle antes de cerrar el <body>.
  Ojo: `src/app/+html.tsx` NO se aplica en modo "single" — solo en "static" —, así que
  todo lo de web va aquí.

  Los marcadores se sustituyen con String.replace y sin flag global, o sea SOLO la
  primera vez que aparecen: no volver a escribirlos en un comentario, porque se
  gastarían aquí y el <html> y el <title> se quedarían con el texto crudo a la vista.

  Aquí está lo que no se puede expresar en React Native: las etiquetas del manifest,
  los meta de Safari para abrirse a pantalla completa desde la pantalla de inicio, y
  los arreglos de layout propios del iPhone.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover es lo que hace que env(safe-area-inset-*) tenga valores
      reales; sin él el notch y la barra de gestos del iPhone tapan la interfaz.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />

    <title>%WEB_TITLE%</title>
    <meta name="description" content="Un entrenador que entiende y educa." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C0D12" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Safari en iOS: pantalla completa, sin barra de direcciones, al abrir desde la
      pantalla de inicio. `apple-mobile-web-app-capable` sigue siendo el que respeta
      iOS aunque esté marcado como obsoleto en favor de `mobile-web-app-capable`.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <style id="momentum-reset">
      /*
        La altura real la marcan html y body. dvh se queda AQUÍ y solo aquí: puesto en
        #root, Safari lo recalcula al aparecer y desaparecer la barra de herramientas y
        la app entera da un salto en cada scroll.
      */
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        background-color: #0c0d12;
      }

      body {
        /* Los <ScrollView> de React Native mandan; el body no scrollea. */
        overflow: hidden;
        overscroll-behavior: none;

        /*
          Los márgenes seguros del iPhone NO se ponen aquí, y esto es importante:
          react-native-safe-area-context los lee él mismo de env(safe-area-inset-*) en web
          (ver NativeSafeAreaProvider.web.js) y los reparte por `useSafeAreaInsets`, que es
          lo que ya usan las pantallas. Ponerlos también en el body los sumaba dos veces, y
          se veía como un hueco muerto debajo de todo — por ejemplo bajo el botón de guardar
          el peso. Un solo responsable: la librería, igual que en nativo.

          `viewport-fit=cover` sigue siendo necesario arriba: sin él, esos env() valen 0 y
          la librería no tendría nada que leer.
        */
      }

      /* #root hereda en porcentaje, nunca en dvh. */
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        overflow: hidden;
      }

      /*
        Safari hace zoom al enfocar cualquier campo con letra menor de 16px, y después
        no deshace el zoom. 16px es el mínimo técnico, no una preferencia estética.
      */
      input,
      select,
      textarea,
      button {
        font-size: 16px;
        font-family: inherit;
      }

      /*
        Objetivo táctil mínimo de 44px (guía de Apple). Solo sube lo que se queda corto:
        es un mínimo, no una altura fija, así que no deforma los controles ya grandes.
      */
      [role='button'],
      button,
      a[role='link'] {
        min-height: 44px;
        min-width: 44px;
      }

      /*
        Ni selección de texto ni menú al mantener pulsado: en una app instalada eso se
        siente como una web, no como una app.
      */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* …salvo donde el usuario querría copiar o pegar de verdad. */
      input,
      textarea {
        -webkit-user-select: auto;
        user-select: auto;
      }
    </style>
  </head>

  <body>
    <noscript>Momentum necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>

    <!--
      Red de seguridad contra la pantalla en blanco.

      En el móvil no hay consola que abrir: si el bundle no carga o revienta al arrancar,
      lo único que se ve es una pantalla vacía, sin ninguna pista de qué ha pasado. Esto
      va ANTES del bundle a propósito, para poder cazar hasta un fallo al descargarlo.

      Si pasados unos segundos la app no ha pintado nada, se muestra el motivo y un botón
      que vacía la caché, quita el service worker y recarga — que es exactamente lo que
      habría que hacer a mano quitando el icono de la pantalla de inicio y volviéndolo a
      añadir. Los datos no se tocan: viven en la base de datos del dispositivo y en la nube.
    -->
    <script>
      (function () {
        var problemas = [];
        var avisado = false;

        function apuntar(texto) {
          if (texto && problemas.indexOf(texto) === -1) problemas.push(texto);
        }

        window.addEventListener(
          'error',
          function (e) {
            // Fallo al descargar un <script>/<link>: el evento viene del propio elemento.
            if (e.target && e.target !== window && e.target.src) {
              apuntar('No se pudo cargar ' + String(e.target.src).split('/').pop());
            } else {
              apuntar(e.message || 'Error al arrancar');
            }
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          apuntar((e.reason && (e.reason.message || e.reason)) || 'Fallo sin capturar');
        });

        function arrancada() {
          var root = document.getElementById('root');
          return !!root && root.childElementCount > 0;
        }

        async function limpiarYRecargar(boton) {
          boton.disabled = true;
          boton.textContent = 'Limpiando…';
          try {
            if (window.caches) {
              var claves = await caches.keys();
              await Promise.all(claves.map(function (k) { return caches.delete(k); }));
            }
            if (navigator.serviceWorker) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
          } catch (e) {
            /* Si algo de esto falla, se recarga igual: puede bastar. */
          }
          location.reload();
        }

        function mostrar() {
          if (avisado || arrancada()) return;
          avisado = true;

          var motivo = problemas.length ? problemas.join('\n') : 'La app no ha terminado de arrancar.';
          var caja = document.createElement('div');
          caja.setAttribute(
            'style',
            'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;' +
              'justify-content:center;gap:18px;padding:28px;box-sizing:border-box;' +
              'background:#0C0D12;color:#F2F3F7;font:16px/1.5 -apple-system,system-ui,sans-serif;' +
              'padding-top:calc(28px + env(safe-area-inset-top));' +
              'padding-bottom:calc(28px + env(safe-area-inset-bottom))',
          );

          var titulo = document.createElement('div');
          titulo.textContent = 'Momentum no ha podido arrancar';
          titulo.setAttribute('style', 'font-size:22px;font-weight:800');

          var texto = document.createElement('div');
          texto.textContent = 'Casi siempre se arregla vaciando la caché. Tus datos no se tocan: están en este dispositivo y en tu cuenta.';
          texto.setAttribute('style', 'color:#A8ADBD');

          var detalle = document.createElement('pre');
          detalle.textContent = motivo;
          detalle.setAttribute(
            'style',
            'margin:0;padding:12px;border-radius:10px;background:#1A1C25;color:#A8ADBD;' +
              'font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;' +
              'max-height:32vh;overflow:auto',
          );

          var limpiar = document.createElement('button');
          limpiar.textContent = 'Vaciar caché y reintentar';
          limpiar.setAttribute(
            'style',
            'min-height:52px;border:0;border-radius:14px;background:#4B32D6;color:#fff;' +
              'font-size:16px;font-weight:800',
          );
          limpiar.onclick = function () { limpiarYRecargar(limpiar); };

          var recargar = document.createElement('button');
          recargar.textContent = 'Solo recargar';
          recargar.setAttribute(
            'style',
            'min-height:44px;border:0;border-radius:14px;background:transparent;color:#A8ADBD;font-size:15px',
          );
          recargar.onclick = function () { location.reload(); };

          caja.appendChild(titulo);
          caja.appendChild(texto);
          caja.appendChild(detalle);
          caja.appendChild(limpiar);
          caja.appendChild(recargar);
          document.body.appendChild(caja);
        }

        // 15 s: de sobra para el primer arranque, que tiene que descargar el .wasm de
        // SQLite y montar la base de datos, y aun así corto para no dejar mirando el vacío.
        setTimeout(mostrar, 15000);
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* Sin service worker la app funciona igual, solo no arranca sin red. */
          });
        });
      }
    </script>
  </body>
</html>
