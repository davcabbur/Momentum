name: Deploy

# Despliegue de la PWA de Momentum a Cloudflare sin necesidad de un ordenador: cada
# push a main (o un run manual desde la app de GitHub) publica la app.
# Los secretos se configuran una vez en Settings → Secrets and variables → Actions.
#
# Importante: NO conectar el repo a Cloudflare Workers Builds. Si se conecta, Cloudflare
# intenta desplegar por su cuenta en paralelo a este workflow y falla; el deploy de
# verdad es este.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: TypeScript
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.worker.json

      - name: Deploy
        run: node scripts/ci-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
